name: Prototype CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable core and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run portable suites
        run: make test test-lifecycle test-rack-adapter
      - name: Test package verifier
        run: python3 tests/package_verifier_test.py
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-sanitizers

  mac-package:
    name: Mac arm64 SDK build and private package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Fetch pinned Rack SDK and Syphon
        run: make deps
      - name: Build plugin
        run: make -j3
      - name: Run supported noninteractive SDK tests
        run: make test test-lifecycle test-rack test-syphon
      - name: Build and verify private package
        run: make dist && python3 scripts/verify-package.py
      - name: Upload verified private package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: RVX-mac-arm64-${{ github.sha }}
          path: dist/RVX-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 7
